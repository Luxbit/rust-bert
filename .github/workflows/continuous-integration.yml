on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

name: Build

jobs:
  build:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --features download-libtorch

  build-no-defaults:
    name: Build no defaults
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --no-default-features --features download-libtorch

  check-onnx-only:
    name: Check ONNX-only build (no libtorch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --no-default-features --features onnx

  test-onnx-only:
    name: Integration tests (ONNX-only, no libtorch)
    runs-on: ubuntu-latest
    env:
      ORT_DYLIB_PATH: /tmp/onnxruntime/lib/libonnxruntime.so
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Download onnxruntime dynamic library
        run: |
          wget -q https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-x64-1.20.1.tgz -O /tmp/onnxruntime.tgz
          mkdir -p /tmp/onnxruntime
          tar xzf /tmp/onnxruntime.tgz -C /tmp/onnxruntime --strip-components=1
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --package rust-bert
            --no-default-features
            --features onnx
            --features remote
            --features default-tls
            --test onnx

  check-libtorch-onnx:
    name: Check libtorch + ONNX dual build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: check
          args: --features doc-only,onnx

  build-windows:
    name: Build Windows
    runs-on: windows-2019
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --features download-libtorch

  build-mac-os:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: build
          args: --features download-libtorch

  test-batch-0:
    name: Integration tests (batch 0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --package rust-bert
            --test albert
            --test bart
            --test bert
            --test distilbert
            --test distilgpt2
            --test electra
            --test gpt2
            --test marian
            --test fnet
            --test deberta
            --test deberta_v2
            --features download-libtorch

  test-batch-1:
    name: Integration tests (batch 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --package rust-bert
            --test mobilebert
            --test openai_gpt
            --test prophetnet
            --test reformer
            --test roberta
            --test t5
            --test xlnet
            --test longformer
            --test pegasus
            --test gpt_neo
            --features download-libtorch

  test-batch-2:
    name: Integration tests (batch 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --package rust-bert
            --test sentence_embeddings
            --test longt5
            --test gpt_j
            --test nllb
            --features download-libtorch

  test-opt-features:
    name: Integration tests (Optional features)
    runs-on: ubuntu-latest
    env:
      ORT_DYLIB_PATH: /tmp/onnxruntime/lib/libonnxruntime.so
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - name: Download onnxruntime dynamic library
        run: |
          wget -q https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-x64-1.20.1.tgz -O /tmp/onnxruntime.tgz
          mkdir -p /tmp/onnxruntime
          tar xzf /tmp/onnxruntime.tgz -C /tmp/onnxruntime --strip-components=1
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --package rust-bert
            --features onnx
            --features hf-tokenizers
            --test onnx
            --test hf_tokenizers
            --features download-libtorch

  convert-model:
    name: Model conversion test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      - run: |
          pip install -r ./utils/requirements.txt --progress-bar off
          python ./utils/download-dependencies_distilbert.py

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add rustfmt
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
      - run: rustup component add clippy
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all-targets --all-features -- -D warnings -A clippy::assign_op_pattern -A clippy::upper-case-acronyms
