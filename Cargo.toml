[package]
name = "rust-bert"
version = "0.23.0"
authors = ["Guillaume Becquin <guillaume.becquin@gmail.com>"]
edition = "2018"
description = "Ready-to-use NLP pipelines and language models"
repository = "https://github.com/guillaume-be/rust-bert"
documentation = "https://docs.rs/rust-bert"
license = "Apache-2.0"
readme = "README.md"
build = "build.rs"
keywords = [
    "nlp",
    "deep-learning",
    "machine-learning",
    "transformers",
    "translation",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rust_bert"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "convert-tensor"
path = "src/convert-tensor.rs"
required-features = ["libtorch"]
doc = false

[[bench]]
name = "sst2_benchmark"
harness = false
required-features = ["libtorch"]

[[bench]]
name = "squad_benchmark"
harness = false
required-features = ["libtorch"]

[[bench]]
name = "summarization_benchmark"
harness = false
required-features = ["libtorch"]

[[bench]]
name = "translation_benchmark"
harness = false
required-features = ["libtorch"]

[[bench]]
name = "generation_benchmark"
harness = false
required-features = ["libtorch"]

[[bench]]
name = "tensor_operations_benchmark"
harness = false
required-features = ["libtorch"]

[[bench]]
name = "token_classification_benchmark"
harness = false
required-features = ["libtorch"]

[profile.bench]
opt-level = 3

[features]
default = ["remote", "default-tls", "libtorch"]
libtorch = ["dep:tch"]
doc-only = ["libtorch", "tch/doc-only"]
all-tests = []
remote = ["cached-path", "dirs", "lazy_static"]
download-libtorch = ["libtorch", "tch/download-libtorch"]
onnx = ["dep:ort"]
cuda = ["onnx", "ort/cuda"]
rustls-tls = ["cached-path/rustls-tls"]
default-tls = ["cached-path/default-tls"]
hf-tokenizers = ["tokenizers"]

[package.metadata.docs.rs]
features = ["doc-only"]

[dependencies]
rust_tokenizers = "8.1.1"
tch = { version = "0.17.0", optional = true, features = ["download-libtorch"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ordered-float = "5"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
half = "2"
regex = "1.11"

cached-path = { version = "0.8", default-features = false, optional = true }
dirs = { version = "6", optional = true }
lazy_static = { version = "1", optional = true }
ort = { version = "=2.0.0-rc.13", optional = true, default-features = false, features = [
    "std",
    "half",
    "ndarray",
    "download-binaries",
    "copy-dylibs",
    "tls-rustls",
] }
ndarray = { version = "0.17" }
tokenizers = { version = "0.21", optional = true, default-features = false, features = [
    "onig",
] }

[dev-dependencies]
anyhow = "1"
csv = "1"
criterion = "0.6"
tokio = { version = "1.45", features = ["sync", "rt-multi-thread", "macros"] }
tempfile = "3"
itertools = "0.14.0"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "half",
    "ndarray",
    "load-dynamic",
] }

[[example]]
name = "onnx-masked-lm"
required-features = ["onnx"]

[[example]]
name = "onnx-question-answering"
required-features = ["onnx"]

[[example]]
name = "onnx-sequence-classification"
required-features = ["onnx"]

[[example]]
name = "onnx-text-generation"
required-features = ["onnx"]

[[example]]
name = "onnx-token-classification"
required-features = ["onnx"]

[[example]]
name = "onnx-translation"
required-features = ["onnx"]

[[example]]
name = "generation_gpt2_hf_tokenizers"
required-features = ["hf-tokenizers"]
